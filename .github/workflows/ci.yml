name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: payment_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Create Test Database
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE payment_ledger_test;"

      - name: Check Code Formatting (Black)
        run: |
          black --check .

      - name: Lint Code (Ruff)
        run: |
          ruff check .

      - name: Type Check (Mypy)
        run: |
          mypy app

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/payment_ledger
        run: |
          alembic upgrade head
          DATABASE_URL="postgresql+asyncpg://postgres:postgrespassword@localhost:5432/payment_ledger_test" alembic upgrade head

      - name: Run Test Suite (Pytest)
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/payment_ledger
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/payment_ledger_test
        run: |
          pytest -v
